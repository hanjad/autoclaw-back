<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Laravel's public/.htaccess does the routing (needs mod_rewrite)
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Logs go to the container's stdout/stderr so they show up in Render's Logs tab
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
