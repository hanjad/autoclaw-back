; Production PHP settings
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
date.timezone = UTC

; A verification submission can carry 4 files of up to 5 MB each
upload_max_filesize = 6M
post_max_size = 26M
max_file_uploads = 10

; The code never changes inside a running container, so skip file checks
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
