# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# Keep this file at the ROOT of the autoclaw-back repository (move it there from this bundle).
#
# FREE plans are for testing only: uploaded files vanish on every restart, the database expires after
# 30 days, and outbound SMTP is blocked. See DEPLOY-RENDER.md before going live.

databases:
  - name: autoclaw-db
    databaseName: autoclaw
    user: autoclaw
    plan: free              # change to a paid plan before real users arrive
    region: frankfurt       # closest Render region to Nigeria; the web service must use the same one

services:
  - type: web
    name: autoclaw-api
    runtime: docker
    plan: free              # change to starter or higher for a persistent disk and SMTP
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up

    # PAID PLANS ONLY: keeps uploaded images and verification documents across restarts.
    # Uncomment, then redeploy.
    # disk:
    #   name: autoclaw-storage
    #   mountPath: /var/www/html/storage/app
    #   sizeGB: 1

    envVars:
      - key: APP_NAME
        value: Autoclaw
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY            # run locally: php artisan key:generate --show   (keep it forever)
        sync: false
      - key: FRONTEND_URL       # e.g. https://autoclaw.example.com (no trailing slash)
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # same value, comma separated if several
        sync: false

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: autoclaw-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: autoclaw-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: autoclaw-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: autoclaw-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: autoclaw-db
          property: password

      - key: LOG_CHANNEL        # file logs disappear on restart; Render's Logs tab reads stderr
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: SANCTUM_EXPIRATION
        value: "10080"
      - key: MARKETPLACE_REQUIRE_VERIFIED
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CLIENT_IP_HEADER   # Render sits behind Cloudflare, which sets this to the visitor's real IP
        value: CF-Connecting-IP

      # Emails are only written to the log until you change this (see DEPLOY-RENDER.md).
      - key: MAIL_MAILER
        value: log
      - key: MAIL_LOG_CHANNEL
        value: mail_stderr
      - key: MAIL_FROM_NAME
        value: Autoclaw

      # Add these in the dashboard (Environment) when you need them:
      #   MAIL_FROM_ADDRESS, RESEND_API_KEY, PAYSTACK_SECRET_KEY
      #   INITIAL_ADMIN_EMAIL, INITIAL_ADMIN_PASSWORD   (first boot only, then delete them)
